<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hulk Hogan Tribute</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Arial Black', Gadget, sans-serif;
            text-align: center;
            color: #ffcc00; /* Default Hulk Yellow */
        }

        img {
            max-width: 90%;
            height: auto;
            margin-bottom: 20px;
        }

        .hulk-text {
            /* Creating a classic Hulkamania yellow-to-red gradient */
            background: linear-gradient(to bottom, #ffea00 0%, #ffcc00 50%, #ff0000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
            line-height: 1.4;
            text-transform: uppercase;
            font-style: italic;
            text-shadow: 2px 2px 4px rgba(255, 0, 0, 0.3);
        }

        .shoutout {
            font-size: 1.5rem;
            margin-top: 10px;
        }

        .footer-code {
            font-size: 1.2rem;
            margin-top: 15px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <img src="https://i.imgur.com/Ue9Yijh.png" alt="Hulk Hogan">

    <div class="hulk-text">
        3GV -.- was here. Nothing is destroyed.
        <div class="footer-code">GiVeM3Th3R00tAndThenWeB0unce!</div>
    </div>

</body>
</html>
